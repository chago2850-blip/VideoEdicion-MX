# Compila los instaladores de MontajeMX para Windows, Linux y macOS.
# Se ejecuta al publicar una etiqueta v* o manualmente desde la pestaña Actions.
name: Instaladores
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fetch: node scripts/fetch-ffmpeg.js linux x64
            build: npx electron-builder --linux --x64 --publish never
          - os: windows-latest
            fetch: node scripts/fetch-ffmpeg.js win32 x64
            build: npx electron-builder --win --x64 --publish never
          - os: macos-latest
            fetch: node scripts/fetch-ffmpeg.js darwin arm64 && node scripts/fetch-ffmpeg.js darwin x64
            build: npx electron-builder --mac --arm64 --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: ${{ matrix.fetch }}
      - if: matrix.os == 'ubuntu-latest'
        run: npm test
      - run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MontajeMX-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
