# Compila los instaladores de MontajeMX para Windows, Linux y macOS, y el APK de Android.
# Se ejecuta al publicar una etiqueta v* o manualmente desde la pestaña Actions.
name: Instaladores
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fetch: node scripts/fetch-ffmpeg.js linux x64
            build: npx electron-builder --linux --x64 --publish never
          - os: windows-latest
            fetch: node scripts/fetch-ffmpeg.js win32 x64
            build: npx electron-builder --win --x64 --publish never
          - os: macos-latest
            fetch: node scripts/fetch-ffmpeg.js darwin arm64 && node scripts/fetch-ffmpeg.js darwin x64
            build: npx electron-builder --mac --arm64 --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: ${{ matrix.fetch }}
      - if: matrix.os == 'ubuntu-latest'
        run: npm test
      - run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MontajeMX-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci || npm install
      - run: node scripts/build-android-web.js
      - run: npx cap sync android
      # Llave de firma opcional (secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD).
      # Sin ella el APK se firma con una llave de depuración: instala igual, pero cada versión pide desinstalar la anterior.
      - name: Llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/montajemx.jks"; echo "MONTAJEMX_KEYSTORE=$RUNNER_TEMP/montajemx.jks" >> "$GITHUB_ENV"; fi
      - name: Compilar APK
        working-directory: android
        env:
          MONTAJEMX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Nombrar APK
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/MontajeMX-$V-android.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: MontajeMX-android
          path: dist/*.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
